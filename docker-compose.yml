version: "3.8"

services:
  cargo-tracker:
    image: cauc3cmp:latest
    container_name: cargo-tracker
    ports:
      - "8080:8080"
    environment:
      - JAVA_OPTS=-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
      - TZ=UTC
      - LANG=en_US.UTF-8
      # Database configuration (H2 embedded by default)
      # Override with PostgreSQL for production:
      # - DB_DRIVER_CLASS=org.postgresql.ds.PGPoolingDataSource
      # - DB_JDBC_URL=jdbc:postgresql://<host>:5432/<database>
      # - DB_USER=<username>
      # - DB_PASSWORD=<password>
      # Graph traversal service URL
      - GRAPH_TRAVERSAL_URL=http://localhost:8080/rest/graph-traversal/shortest-path
    volumes:
      - cargo-tracker-data:/opt/payara/cargo-tracker-data
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "java -version 2>&1 | grep -q version || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  cargo-tracker-data:
    driver: local

networks:
  app-network:
    driver: bridge
