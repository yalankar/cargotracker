apiVersion: apps/v1
kind: Deployment
metadata:
  name: cargo-tracker
  namespace: cargo-tracker
  labels:
    app: cargo-tracker
    version: "3.1"
    component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cargo-tracker
  template:
    metadata:
      labels:
        app: cargo-tracker
        version: "3.1"
        component: web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: cargo-tracker
          image: "{{IMAGE_URI}}"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: JAVA_OPTS
              value: "-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+UnlockExperimentalVMOptions -Djava.net.preferIPv4Stack=true"
            - name: TZ
              value: "UTC"
            - name: LANG
              value: "en_US.UTF-8"
            # Graph traversal URL - update if running a separate pathfinder service
            - name: GRAPH_TRAVERSAL_URL
              value: "{{GRAPH_TRAVERSAL_URL}}"
            # Database configuration - defaults to embedded H2
            # Uncomment and configure for PostgreSQL:
            # - name: DB_DRIVER_CLASS
            #   value: "{{DB_DRIVER_CLASS}}"
            # - name: DB_JDBC_URL
            #   value: "{{DB_JDBC_URL}}"
            # - name: DB_USER
            #   value: "{{DB_USER}}"
            # - name: DB_PASSWORD
            #   valueFrom:
            #     secretKeyRef:
            #       name: cargo-tracker-db-secret
            #       key: password
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /cargo-tracker/
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 5
          volumeMounts:
            - name: cargo-tracker-data
              mountPath: /opt/payara/cargo-tracker-data
      volumes:
        - name: cargo-tracker-data
          emptyDir: {}
      terminationGracePeriodSeconds: 60
      restartPolicy: Always
